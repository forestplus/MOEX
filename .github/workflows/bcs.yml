name: BCS API

on:
  workflow_dispatch:
  schedule:
    # примерно торговые часы МСК (UTC): каждые 30 минут по будням
    - cron: "*/30 6-16 * * 1-5"

permissions:
  contents: write

concurrency:
  group: bcs-export
  cancel-in-progress: false

jobs:
  bcs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests cryptography

      - name: Check token
        working-directory: bcs
        env:
          BCS_API_KEY_READ: ${{ secrets.BCS_API_KEY_READ }}
        run: python check_token.py

      - name: Export portfolio
        working-directory: bcs
        env:
          BCS_API_KEY_READ: ${{ secrets.BCS_API_KEY_READ }}
          # если заданы — JSON портфеля шифруется тем же паролем, что и страницы
          MX_LOGIN: ${{ secrets.MX_LOGIN }}
          MX_PASSWORD: ${{ secrets.MX_PASSWORD }}
          BCS_DEBUG: "1"
        run: python export_portfolio.py

      - name: Export quotes
        working-directory: bcs
        continue-on-error: true  # котировки дублируют MOEX ISS — не критично
        env:
          BCS_API_KEY_READ: ${{ secrets.BCS_API_KEY_READ }}
        run: python export_quotes.py

      - name: Rotate BCS secret if needed
        # Если БКС ротировал refresh-токен, скрипты кладут новый в bcs/.runtime/.
        # Обновляем секрет, иначе следующий прогон отвалится с 400/401.
        # Нужен секрет GH_PAT (fine-grained PAT с правом Secrets: write на этот репозиторий).
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ ! -f bcs/.runtime/new_refresh_token ]; then
            echo "Ротации не было"
          elif [ -z "$GH_TOKEN" ]; then
            echo "::warning::БКС ротировал refresh-токен, но секрета GH_PAT нет — обновите BCS_API_KEY_READ вручную, иначе следующий прогон упадёт!"
          else
            gh secret set BCS_API_KEY_READ --body "$(cat bcs/.runtime/new_refresh_token)" \
              --repo "$GITHUB_REPOSITORY" --app actions
            echo "::notice::Refresh-токен BCS ротирован и секрет обновлён"
            rm bcs/.runtime/new_refresh_token
          fi

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Нет изменений в data/"
          else
            git commit -m "BCS data update"
            git pull --rebase origin main
            git push
          fi
